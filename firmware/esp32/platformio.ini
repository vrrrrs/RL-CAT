; RL-CAT ESP32-C3 wireless bridge -- PlatformIO project
;
; Framework: ESP-IDF (per docs/32-esp32-bridge.md §1 decision 1: self-written
; passthrough, NOT ESP-AT).  Arduino is deliberately not used.
;
; Board: ESP32-C3 with 4 MB *embedded* flash + native USB-Serial-JTAG.
;   Measured on the actual board (esptool): ESP32-C3 (QFN32) rev v0.4,
;   embedded flash 4 MB (XMC), crystal 40 MHz, MAC e0:72:a1:22:e9:58.
;   => esp32-c3-devkitm-1 (ESP32-C3-MINI-1 class module) is the right board id.
;
; Toolchain locations (this machine):
;   PLATFORMIO_CORE_DIR      = <repo>\.pio-core        (set by firmware/tools/pio.ps1)
;   PLATFORMIO_PACKAGES_DIR  = D:\Work\EspIDF\packages
;   PLATFORMIO_PLATFORMS_DIR = D:\Work\EspIDF\platforms
; Always invoke pio through firmware/tools/pio.ps1 so these are applied.

[platformio]
default_envs = esp32c3

; ESP-IDF's build script refuses to run when FRAMEWORK_DIR or BUILD_DIR contains
; a whitespace character (builder/frameworks/espidf.py: `if any(" " in p for p in
; (FRAMEWORK_DIR, BUILD_DIR))`).  This repo lives under "C:\Users\<user name>\...",
; so the default build dir (<project>/.pio/build/<env>) is rejected.
; Moving only the build output to a space-free path fixes it; the source tree may
; stay where it is.
build_dir = D:/Work/EspIDF/build

[env:esp32c3]
platform = espressif32@6.13.0
board = esp32-c3-devkitm-1
framework = espidf

; ESP-IDF version: leave it at the platform default (5.5.3, i.e. framework-espidf
; ~3.50503.0).  Do NOT try to pin framework-espidf@~3.40407.0 (IDF 4.4.7) to save
; bandwidth: platform-espressif32's platform.py (L124-142) forces the *latest*
; RISC-V toolchain for espidf-only projects, so an older IDF would end up paired
; with the newer toolchain.  5.5.x is what this platform is built and tested for.
 
; Console/logs go to the chip's native USB-Serial-JTAG (see sdkconfig.defaults),
; UART1 is reserved for the STM32 link.
monitor_speed = 115200

; Custom partition table: 2 MB factory app instead of the 1 MB default.
; ⚠️ PlatformIO's ESP-IDF integration generates the partition table ITSELF
;    (builder/frameworks/espidf.py:1528 -- board.get("build.partitions",
;    "partitions_singleapp.csv")) and ignores CONFIG_PARTITION_TABLE_CUSTOM in
;    sdkconfig.  Without the line below the 2 MB table in partitions.csv is
;    silently replaced by IDF's 1 MB single-app table.  Verified on the bench:
;    the boot log must print "factory ... 00200000" for the app partition.
board_build.partitions = partitions.csv
; Tell PlatformIO the real application partition size; the board definition still
; assumes IDF's 1 MB default, which makes the "Flash: xx%" report misleading.
board_upload.maximum_size = 2097152

; sdkconfig.defaults in the project root is applied automatically by PlatformIO.
build_flags =
    -D RLCA_TARGET_ESP32C3=1

; Disable ESP-IDF's component manager.
; Reason: it crashes during CMake configure on this machine --
;   idf_component_manager/prepare_components/prepare.py:37 writes
;   <build_dir>/component_manager_run_counter.<pid> and gets
;   "PermissionError: [Errno 13] Permission denied" (see docs/34-esp32-plan.md
;   risk log).  This project has no external (idf_component.yml) dependencies,
;   so the component manager is not needed; build.cmake skips its invocation
;   when IDF_COMPONENT_MANAGER is 0.
board_build.cmake_extra_args = -DIDF_COMPONENT_MANAGER=0
